<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Exam Question Setter</title>
 <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
 <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
 <script>
window.MathJax = {
  tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] }
};
</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
  body { background: #fff; color: #000; line-height: 1.4; padding: 5px; }
  .container { max-width: 900px; margin: 0 auto; padding: 5px; }

  header { text-align: center; margin-bottom: 10px; padding: 5px; }
  header h1 { font-size: 1.4rem; margin-bottom: 3px; }
  header h2 { font-size: 1rem; }

  .exam-container { background: white; padding: 10px; border-radius: 5px; box-shadow: none; }
  .exam-header { text-align: center; margin-bottom: 8px; padding-bottom: 4px; border-bottom: 1px solid #aaa; }
  .instructions { font-size: 0.85rem; margin-bottom: 8px; }
  .instructions ul { margin-left: 15px; }

  .question { margin-bottom: 6px; padding-bottom: 4px; border-bottom: 1px dashed #ccc; font-size: 0.9rem; }
  .question-header { display: flex; justify-content: space-between; margin-bottom: 3px; }
  .marks { font-weight: bold; color: #000; font-size: 0.8rem; }

  .subquestion { display: flex; justify-content: space-between; margin-left: 12px; font-size: 0.85rem; margin-bottom: 3px; }
  .part-text { flex-grow: 1; }
  .part-marks { font-size: 0.75rem; color: #333; margin-top: 1px; }

  .footer { text-align: center; margin-top: 8px; font-size: 0.75rem; color: #555; }

  /* Form & Controls */
  .form-container { display: flex; flex-direction: column; gap: 10px; }
  .form-section { border: 1px solid #ccc; padding: 10px; border-radius: 5px; }
  .form-group { margin-bottom: 8px; }
  label { font-size: 0.9rem; display: block; margin-bottom: 2px; }
  input[type="text"], input[type="number"], textarea {
    width: 100%;
    padding: 4px;
    border: 1px solid #ccc;
    border-radius: 3px;
    font-size: 0.85rem;
  }
  textarea { min-height: 60px; }
  
  .question-item { border: 1px solid #ddd; padding: 8px; margin-bottom: 8px; border-radius: 4px; }
  .subquestion-item { margin-left: 10px; border-left: 2px solid #eee; padding-left: 8px; }
  
  /* Buttons */
  .controls { display: flex; justify-content: center; margin-top: 10px; }
  .btn { padding: 5px 10px; margin: 3px; border: none; border-radius: 3px; cursor: pointer; font-size: 0.8rem; }
  .btn-success { background-color: #28a745; color: #fff; }
  .btn-secondary { background-color: #6c757d; color: #fff; }
  .btn-danger { background-color: #dc3545; color: #fff; }
  #add-question { background-color: #007bff; color: #fff; }
  #reset-btn { background-color: #6c757d; color: #fff; }
  #download-btn { background-color: #6f42c1; color: #fff; }
  #edit-btn { background-color: #17a2b8; color: #fff; }
  .add-sub { background-color: #fd7e14; color: #fff; }

  /* COMPACT PRINT MODE */
  @media print {
    body { padding: 0; margin: 5mm; font-size: 10pt; }
    .controls, .footer, .form-container { display: none !important; }
    header { margin-bottom: 4px; padding: 0; }
    .exam-container { padding: 0; box-shadow: none; border: none; }
    .instructions { margin-bottom: 4px; font-size: 9pt; }
    .question { margin-bottom: 4px; padding-bottom: 2px; font-size: 10pt; }
    .subquestion { margin-left: 10px; font-size: 9.5pt; margin-bottom: 2px; }
  }
</style>

</head>
<body>

 <div class="container">
  <header id="header">
   <h1 id="college-name">College Name</h1>
   <h2 id="department-name">Department Name</h2>
  </header>

  <div class="form-container" id="input-form">
   <div class="form-section">
    <h2>Details</h2>
    <div class="form-group">
     <label for="input-college">College:</label>
     <input type="text" id="input-college" placeholder="Enter your college name">
    </div>
    <div class="form-group">
     <label for="input-dept">Department:</label>
     <input type="text" id="input-dept" placeholder="Enter your department name">
    </div>
    <div class="form-group">
     <label for="exam-name">Exam Name:</label>
     <input type="text" id="exam-name" value="Number Theory Midterm">
    </div>
    <div class="form-group">
     <label for="total-marks">Total Marks:</label>
     <input type="number" id="total-marks" value="60">
    </div>
    <div class="form-group">
     <label for="time-allowed">Time:</label>
     <input type="text" id="time-allowed" value="2 hours">
    </div>
   </div>

   <div class="form-section">
    <h2>Instructions</h2>
    <div class="form-group">
     <textarea id="instructions">Answer all questions
Show all working
Calculators are not allowed</textarea>
    </div>
   </div>

   <div class="form-section">
    <h2>Questions</h2>
    <div id="questions-container"></div>
    <button class="btn" id="add-question">Add Question</button>
   </div>

   <div class="controls">
    <button class="btn btn-success" id="generate-btn">Generate Exam</button>
    <button class="btn btn-secondary" id="reset-btn">Reset Form</button>
   </div>
  </div>

  <div id="exam-preview" class="exam-container" style="display: none;">
   <div class="exam-header">
    <h2 id="preview-exam-name">Number Theory Midterm</h2>
    <p>Total Marks: <span id="preview-total-marks">60</span> | Time: <span id="preview-time">2 hours</span></p>
   </div>
   <div class="instructions" id="preview-instructions"></div>
   <div id="preview-questions"></div>
   <div class="footer"><p>End of Examination</p></div>
   <div class="controls">
    <button class="btn" id="download-btn">Download as PDF</button>
    <button class="btn btn-secondary" id="edit-btn">Edit Exam</button>
   </div>
  </div>
 </div>

 <script>
  let questionCount = 0;

  document.addEventListener('DOMContentLoaded', () => {
   addQuestion(1);
   document.getElementById('add-question').addEventListener('click', () => addQuestion());
   document.getElementById('generate-btn').addEventListener('click', generateExam);
   document.getElementById('download-btn').addEventListener('click', downloadPDF);
   document.getElementById('edit-btn').addEventListener('click', editExam);
   document.getElementById('reset-btn').addEventListener('click', resetForm);
  });

  function addQuestion(initial=0) {
   questionCount++;
   const container = document.getElementById('questions-container');
   const div = document.createElement('div');
   div.className = 'question-item';
   div.dataset.qid = questionCount;
   const qText = initial ? 'Prove that $\\sqrt{2}$ is irrational.' : '';
   const qMarks = initial ? '5' : '5';
   div.innerHTML = `
    <h4>Question ${questionCount}</h4>
    <div class="form-group">
     <textarea class="q-text" placeholder="e.g., Prove that $\\sqrt{2}$ is irrational.">${qText}</textarea>
    </div>
    <div class="form-group">
     <label>Marks:</label>
     <input type="number" class="q-marks" value="${qMarks}" min="1">
    </div>
    <div class="form-group">
     <div class="subquestions"></div>
     <button type="button" class="btn btn-secondary add-sub">Add Sub</button>
    </div>
    <button type="button" class="btn btn-danger remove-q">Remove</button>
   `;
   container.appendChild(div);
   div.querySelector('.add-sub').addEventListener('click', () => addSubquestion(div));
   div.querySelector('.remove-q').addEventListener('click', () => removeQuestion(div));
  }

  function addSubquestion(qDiv) {
   const subs = qDiv.querySelector('.subquestions');
   const count = subs.children.length;
   const subDiv = document.createElement('div');
   subDiv.className = 'subquestion-item';
   subDiv.innerHTML = `
    <div class="form-group">
     <label>Subquestion ${String.fromCharCode(97 + count)} Text:</label>
     <textarea class="sub-text" placeholder="e.g., Use proof by contradiction."></textarea>
    </div>
    <div class="form-group">
     <label>Marks:</label>
     <input type="number" class="sub-marks" value="2" min="1">
    </div>
    <button type="button" class="btn btn-danger remove-sub">Remove Sub</button>
   `;
   subs.appendChild(subDiv);
   subDiv.querySelector('.remove-sub').addEventListener('click', () => {
    subDiv.remove();
    renumberSubquestions(qDiv);
   });
    renumberSubquestions(qDiv);
  }

  function renumberSubquestions(qDiv) {
   const subs = qDiv.querySelectorAll('.subquestion-item');
   subs.forEach((sq, idx) => {
    const label = sq.querySelector('label');
    if (label) label.textContent = `Subquestion ${String.fromCharCode(97 + idx)} Text:`;
   });
  }

  function removeQuestion(qDiv) {
   qDiv.remove();
   const questions = document.querySelectorAll('.question-item');
   questionCount = questions.length;
   questions.forEach((q, i) => q.querySelector('h4').textContent = `Question ${i+1}`);
  }

  function generateExam() {
   const college = document.getElementById('input-college').value || 'College Name';
   const dept = document.getElementById('input-dept').value || 'Department Name';
   document.getElementById('college-name').textContent = college;
   document.getElementById('department-name').textContent = dept;
   document.getElementById('preview-exam-name').textContent = document.getElementById('exam-name').value;
   document.getElementById('preview-total-marks').textContent = document.getElementById('total-marks').value;
   document.getElementById('preview-time').textContent = document.getElementById('time-allowed').value;
   const instr = document.getElementById('instructions').value.split('\n').filter(i => i.trim() !== '');
   const instrBox = document.getElementById('preview-instructions');
   instrBox.innerHTML = '<p><strong>Instructions:</strong></p><ul>' + instr.map(i => `<li>${i}</li>`).join('') + '</ul>';
   const preview = document.getElementById('preview-questions');
   preview.innerHTML = '';
   const questions = document.querySelectorAll('.question-item');
   questions.forEach((q, idx) => {
    const text = q.querySelector('.q-text').value;
    const marks = q.querySelector('.q-marks').value;
    const qDiv = document.createElement('div');
    qDiv.className = 'question';
    qDiv.innerHTML = `
     <div class="question-header">
      <h3>Question ${idx+1}</h3>
      <span class="marks">[${marks} marks]</span>
     </div>
     <p class="question-text">${text}</p>
    `;
    const subs = q.querySelectorAll('.subquestion-item');
    if (subs.length > 0) {
     subs.forEach((sub, j) => {
      const sText = sub.querySelector('.sub-text').value;
      const sMarks = sub.querySelector('.sub-marks').value;
      const sDiv = document.createElement('div');
      sDiv.className = 'subquestion';
      sDiv.innerHTML = `
       <p class="part-text">(${String.fromCharCode(97+j)}) ${sText}</p>
       <span class="part-marks">[${sMarks} marks]</span>
      `;
      qDiv.appendChild(sDiv);
     });
    }
    preview.appendChild(qDiv);
   });
   document.getElementById('exam-preview').style.display = 'block';
   document.getElementById('input-form').style.display = 'none';
   MathJax.typesetPromise();
  }

  function editExam() {
   document.getElementById('exam-preview').style.display = 'none';
   document.getElementById('input-form').style.display = 'flex';
  }

  function resetForm() {
   if (confirm('Are you sure you want to reset?')) {
    document.getElementById('questions-container').innerHTML = '';
    document.getElementById('exam-name').value = 'Number Theory Midterm';
    document.getElementById('total-marks').value = '60';
    document.getElementById('time-allowed').value = '2 hours';
    document.getElementById('instructions').value = 'Answer all questions\nShow all working\nCalculators are not allowed';
    questionCount = 0;
    addQuestion(1);
   }
  }

  async function downloadPDF() {
   const controls = document.querySelectorAll('.controls');
   controls.forEach(c => c.style.display = 'none');
   await MathJax.typesetPromise();
   window.print();
   controls.forEach(c => c.style.display = 'flex');
  }
 </script>
</body>
</html>
